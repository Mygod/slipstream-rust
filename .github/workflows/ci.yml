name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out slipstream-rust
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev python3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust fmt
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        env:
          RUST_BACKTRACE: "1"
        run: cargo test

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out slipstream-rust
        uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit

  build-binaries:
    name: Build Binaries (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mipsel-musl
            runner: ubuntu-24.04
            artifact: slipstream-linux-mipsel-musl
            build_script: ./scripts/build-mipsel-musl.sh
            client_binary: build/slipstream-client-linux-mipsel-musl
            server_binary: build/slipstream-server-linux-mipsel-musl
    steps:
      - name: Check out slipstream-rust
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build binary artifact
        uses: ./.github/actions/build-binary
        with:
          build-script: ${{ matrix.build_script }}
          artifact-name: ${{ matrix.artifact }}
          client-binary: ${{ matrix.client_binary }}
          server-binary: ${{ matrix.server_binary }}
