name: Build slipstream binary artifact
description: Build, package, and upload slipstream client/server binaries.

inputs:
  build-script:
    description: Repository script that builds the target binaries.
    required: true
  artifact-name:
    description: Uploaded artifact name and checksum basename.
    required: true
  client-binary:
    description: Path to the built client binary.
    required: true
  server-binary:
    description: Path to the built server binary.
    required: true

runs:
  using: composite
  steps:
    - name: Build binaries
      shell: bash
      run: ${{ inputs.build-script }}

    - name: Package binaries
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        CLIENT_BINARY: ${{ inputs.client-binary }}
        SERVER_BINARY: ${{ inputs.server-binary }}
      run: |
        set -euo pipefail

        dist_dir="dist"
        package_dir="${dist_dir}/${ARTIFACT_NAME}"
        rm -rf "${package_dir}"
        mkdir -p "${package_dir}"

        cp "${CLIENT_BINARY}" "${package_dir}/"
        cp "${SERVER_BINARY}" "${package_dir}/"

        tar -C "${dist_dir}" -czf "${dist_dir}/${ARTIFACT_NAME}.tar.gz" "${ARTIFACT_NAME}"
        (cd "${dist_dir}" && sha256sum "${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.sha256")
        rm -rf "${package_dir}"

    - name: Upload binaries
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          dist/${{ inputs.artifact-name }}.tar.gz
          dist/${{ inputs.artifact-name }}.sha256
        if-no-files-found: error
